services:
  db:
    image: postgres:16
    container_name: invoices-pg
    environment:
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: invoices
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invoices"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata: